<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var hash = location.hash || "";
        var next = "";
        var item = hash.match(/^#\/i\/(\d+)\/?$/i);
        var match = hash.match(/^#\/(c|m)\/([a-z0-9-]{1,32})(?:\/(\d+))?\/?$/i);
        if (item) next = "/i/" + item[1];
        else if (match) {
          var kind = match[1].toLowerCase();
          var slug = match[2].toLowerCase();
          next = kind === "m" ? "/m/" + slug : "/c/" + slug + (match[3] ? "/" + match[3] : "");
        }
        if (!next) return;
        var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
        if (path === next && !hash) return;
        var url = next + location.search;
        var host = location.hostname;
        if (host === "localhost" || host === "127.0.0.1" || host === "[::1]") history.replaceState(null, "", url);
        else location.replace(url);
      })();
    </script>
